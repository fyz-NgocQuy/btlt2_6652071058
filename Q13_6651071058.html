<!DOCTYPE html>
<html>
<head>
    <title>Đăng ký</title>

    <script>
        function dongy() {
            document.getElementById("thongbao").innerText =
                "Bạn đã đăng ký thành công!!!";
        }
    </script>
</head>

<body>

<form>
    <table border="1" width="450">

        <tr>
            <td colspan="2" align="center">
                <h2>Đăng ký</h2>
            </td>
        </tr>

        <tr>
            <td>Họ và tên:</td>
            <td>
                <input type="text" id="hoten" size="30">
            </td>
        </tr>

        <tr>
            <td>Giới tính:</td>
            <td>
                <input type="radio"
                       name="gioitinh"
                       id="nam"
                       value="Nam"
                       checked>
                Nam

                <input type="radio"
                       name="gioitinh"
                       id="nu"
                       value="Nữ">
                Nữ
            </td>
        </tr>

        <tr>
            <td>Nghề nghiệp:</td>
            <td>
                <select id="nghenghiep">
                    <option value="Bác sĩ">Bác sĩ</option>
                    <option value="Kỹ sư">Kỹ sư</option>
                    <option value="Giáo viên">Giáo viên</option>
                    <option value="Khác">Khác</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Chọn sản phẩm tham gia:</td>
            <td>
                <select id="sanpham">
                    <option value="Sản phẩm 1">Sản phẩm 1</option>
                    <option value="Sản phẩm 2">Sản phẩm 2</option>
                    <option value="Sản phẩm 3">Sản phẩm 3</option>
                    <option value="Sản phẩm 4">Sản phẩm 4</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Địa chỉ:</td>
            <td>
                <input type="text" id="diachi" size="30">
            </td>
        </tr>

        <tr>
            <td>Số điện thoại:</td>
            <td>
                <input type="text" id="sodienthoai" size="30">
            </td>
        </tr>

        <tr>
            <td>Email:</td>
            <td>
                <input type="text" id="email" size="30">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="button"
                       id="dongy"
                       value="Đồng ý"
                       onclick="dongy()">
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <div id="thongbao"></div>
            </td>
        </tr>

    </table>
</form>

</body>
</html>
